<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>English poem generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>English poem AI generator</h1>
      </header>
      <main>
        <form>
          <input
            type="text"
            placeholder="Enter the topic of the poem"
            autofocus
            required
            autocomplete="off"
            class="topic"
          />
          <input type="submit" class="submitButton" />
        </form>
        <div class="poem">
          The poem will go here
          <br />
          The poem will go here
        </div>
      </main>
      <footer>
        This AI project was coded by
        <a href="https://github.com/VulaniMap" target="_blank">
          Vulani Mapiyeye</a
        >
        and is open-source on
        <a
          href="https://github.com/VulaniMap/english-poem-generator"
          target="_blank"
          >GitHub</a
        >
        and is hosted on
        <a href="https://ai-poem-generator-ww56.onrender.com" target="_blank"
          >Render</a
        >
      </footer>
    </div>
  </body>
  <script src="src/index.js"></script>
</html>
